# Deploys the live Zo site on every push to main.
# Same as `scripts/deploy-zo.sh`: syncs Zo's clone (/home/workspace/repos/todo,
# outside the Mutagen-synced personal-os tree) to origin/main + runs
# `./redeploy.sh` on Zo via the Zo MCP bash tool. Uses fetch + reset (not
# pull): GitHub is the source of truth. Before resetting it logs `git status`
# and auto-stashes any unexpected local changes (evidence, recoverable via
# `git stash list`) instead of silently bulldozing them. Needs the ZO_TOKEN
# repo secret.
name: Deploy to Zo

on:
  push:
    branches: [main]
    # Docs-only pushes don't affect the built site — skip the redeploy.
    # A push mixing code + docs still deploys (any non-ignored file triggers).
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-zo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pull main + redeploy on Zo
        env:
          ZO_TOKEN: ${{ secrets.ZO_TOKEN }}
        run: |
          # mcporter pinned: 0.13.0 moved --header off the call command
          out="$(npx -y mcporter@0.12.3 call "https://api.zo.computer/mcp.bash" \
            --header "Authorization=Bearer $ZO_TOKEN" \
            --args '{"cmd":"cd /home/workspace/repos/todo && git status --short && git stash push --include-untracked -m pre-deploy-autostash && git fetch origin main && git reset --hard FETCH_HEAD && ./redeploy.sh","description":"todo deploy (GitHub Actions)"}')"
          echo "$out"
          # redeploy.sh prints "✅ Live:" once the site returns HTTP 200.
          echo "$out" | grep -q "✅ Live" || { echo "::error::Redeploy did not report success"; exit 1; }
      - run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://todo-jlong.zocomputer.io/todo)"
          echo "Live site returned HTTP $code"
          [ "$code" = "200" ]
