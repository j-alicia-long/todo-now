# Builds the static demo (VITE_DEMO: in-memory transport + sample data,
# no API server) and publishes it to GitHub Pages at
# https://j-alicia-long.github.io/todo-now/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    # Pushes that can't affect the demo build skip it: docs, plus git/lint/
    # format/hook configs, workflow files, and Mac-side tooling in scripts/.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".github/**"
      - ".husky/**"
      - ".lintstagedrc"
      - ".prettierrc"
      - ".prettierignore"
      - "eslint.config.js"
      - "stylelint.config.js"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx vite build --base=/todo-now/ --outDir dist-demo
        env:
          VITE_DEMO: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
